name: Standard CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  SKIP_ENV_VALIDATION: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  node-root:
    name: Node (.)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      POSTGRES_PRISMA_URL: postgresql://postgres:postgres@localhost:5432/postgres
      POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@localhost:5432/postgres
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Use example env
        run: cp .env.example .env
      - name: Install
        run: npm ci || npm install
      - name: Install test browser (Playwright Chromium)
        run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run check-types
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test
      - name: Dependency audit (report only)
        continue-on-error: true
        run: npm audit --audit-level=high
